services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backend:/app
    environment:
      - TZ=Asia/Tokyo
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=sqlite:////app/data/app.db
    restart: no

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_API_TARGET=http://backend:8000
    restart: no
